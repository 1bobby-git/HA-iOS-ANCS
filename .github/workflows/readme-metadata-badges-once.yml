name: One-time README metadata badges

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-metadata-badges-once.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README badges
        run: |
          set -euo pipefail
          python3 .github/scripts/update_readme_badges_once.py
          rm -f .github/scripts/update_readme_badges_once.py
          rm -f .github/workflows/readme-metadata-badges-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: add release architecture license badges"
            git push
          fi
