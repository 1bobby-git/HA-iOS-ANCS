name: Validate

"on":
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

# Floating action refs are intentional: HACS and Hassfest should validate
# against current rules, and scheduled runs detect upstream validation-rule drift.
# Top-level no permissions plus job-level contents: read permissions limit exposure.
jobs:
  source-tests:
    name: Source and Home Assistant tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_test.txt
      - name: Compile Home Assistant integration
        run: python -m compileall -q custom_components/ha_ios_ancs
      - name: Run source and integration tests
        run: python -m pytest -q tools/tests tests

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master
