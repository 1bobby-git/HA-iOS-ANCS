name: Finalize firmware 0.3.7

on:
  push:
    branches:
      - fix/enroll-wifi-stability-0.3.7
    paths:
      - .github/workflows/finalize-0.3.7.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-firmware-0.3.7
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completed firmware branch
        uses: actions/checkout@v4
        with:
          ref: fix/enroll-wifi-stability-0.3.7
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply documentation and repository cleanup
        run: python .github/scripts/finalize_037.py

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_test.txt

      - name: Compile Home Assistant integration
        run: python -m compileall -q custom_components/ha_ios_ancs

      - name: Run complete repository test suite
        run: python -m pytest -q tools/tests tests

      - name: Commit final firmware release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: finalize firmware 0.3.7"
          git push origin HEAD:fix/enroll-wifi-stability-0.3.7
