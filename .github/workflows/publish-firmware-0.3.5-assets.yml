name: Publish firmware 0.3.5 assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-firmware-0.3.5-assets.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify firmware files and SHA-256 fingerprints
        run: |
          set -euo pipefail
          test -f docs/release-fingerprints-v0.3.5.sha256
          for target in esp32 esp32c2 esp32c3 esp32c5 esp32c6 esp32c61 esp32s3; do
            test -f "docs/firmware/${target}/ios-ancs-${target}-v0.3.5.factory.bin"
          done
          sha256sum -c docs/release-fingerprints-v0.3.5.sha256

      - name: Update release notes and upload firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          Home Assistant용 iOS ANCS 통합 0.6.7과 ESP32 펌웨어 0.3.5 릴리스입니다.

          ## Home Assistant 통합 0.6.7

          - 알림 저장을 2초 범위의 지연 병합 방식으로 최적화했습니다.
          - 엔티티 상태 반영은 지연하지 않으며 마지막 알림 복원 동작을 유지합니다.

          ## ESP32 펌웨어 0.3.5

          - 설정 포털에서 BLE 연결 없이 ESP32 → MQTT → Home Assistant 테스트 알림을 전송할 수 있습니다.
          - MQTT Discovery를 연결 직후 우선 발행해 최초 기기 등록 시간을 수분에서 수초 수준으로 줄였습니다.
          - MQTT 상태를 2초마다 갱신하고 TCP 시간 초과, 포트 거부, 인증 거부와 다음 재시도 시간을 표시합니다.
          - MQTT 재연결을 5초 → 15초 → 30초 → 60초 백오프로 제한하고 중복 연결 시도를 차단했습니다.
          - BLE 인증 실패가 3회 반복되면 무한 재연결을 중지하고 iPhone 등록 복구 절차를 안내합니다.
          - 고정 PIN 대신 장치별 무작위 6자리 등록 코드를 사용합니다.
          - 설정 AP 접속자를 1명으로 제한하고 PMF, HTTP LRU 정리와 소켓 제한을 적용했습니다.

          지원 대상: ESP32, ESP32-C2, ESP32-C3, ESP32-C5, ESP32-C6, ESP32-C61, ESP32-S3

          펌웨어 0.3.4 사용자는 위 개선사항을 적용하려면 0.3.5로 다시 설치해야 합니다. 브라우저 설치 페이지에서 자신의 보드를 선택해 설치하십시오.

          검증 결과: Python 3.14 및 Home Assistant 2026.7.3 기준 301개 테스트, HACS 9개 검사, Hassfest 검증을 모두 통과했습니다.
          EOF

          gh release edit v0.6.7 \
            --title "iOS ANCS 0.6.7 / Firmware 0.3.5" \
            --notes-file /tmp/release-notes.md

          gh release upload v0.6.7 \
            docs/firmware/esp32/ios-ancs-esp32-v0.3.5.factory.bin \
            docs/firmware/esp32c2/ios-ancs-esp32c2-v0.3.5.factory.bin \
            docs/firmware/esp32c3/ios-ancs-esp32c3-v0.3.5.factory.bin \
            docs/firmware/esp32c5/ios-ancs-esp32c5-v0.3.5.factory.bin \
            docs/firmware/esp32c6/ios-ancs-esp32c6-v0.3.5.factory.bin \
            docs/firmware/esp32c61/ios-ancs-esp32c61-v0.3.5.factory.bin \
            docs/firmware/esp32s3/ios-ancs-esp32s3-v0.3.5.factory.bin \
            docs/release-fingerprints-v0.3.5.sha256 \
            --clobber
