name: Repair enrollment and Wi-Fi for firmware 0.3.7

on:
  push:
    branches:
      - fix/enroll-wifi-stability-0.3.7
    paths:
      - .github/workflows/repair-0.3.7.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-firmware-0.3.7
  cancel-in-progress: false

jobs:
  repair-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/enroll-wifi-stability-0.3.7
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply source repair
        run: |
          set -o pipefail
          python .github/scripts/repair_037.py 2>&1 | tee repair-source.log

      - name: Preserve source-patch diagnostic
        if: failure()
        run: |
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f repair-source.log
          git commit -m "chore: preserve repair failure diagnostic"
          git push origin HEAD:fix/enroll-wifi-stability-0.3.7

      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_test.txt

      - name: Compile Home Assistant integration
        run: python -m compileall -q custom_components/ha_ios_ancs

      - name: Run enrollment, portal, Wi-Fi, and integration tests
        run: |
          python -m pytest -q \
            tools/tests/test_portal_contract.py \
            tools/tests/test_onboarding_recovery_contract.py \
            tools/tests/test_ble_security_contract.py \
            tools/tests/test_mqtt_contract.py \
            tests

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore iPhone enrollment and Wi-Fi stability"
          git push origin HEAD:fix/enroll-wifi-stability-0.3.7

  build-firmware:
    needs: repair-source
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Check out repaired source
        uses: actions/checkout@v4
        with:
          ref: fix/enroll-wifi-stability-0.3.7
          fetch-depth: 0

      - name: Trust workspace and install release test dependency
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python -m pip install --disable-pip-version-check pytest

      - name: Build and package all supported firmware targets
        run: python .github/scripts/build_release_037.py

      - name: Commit release binaries and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "build: publish firmware 0.3.7"
          git push origin HEAD:fix/enroll-wifi-stability-0.3.7

  final-validation:
    needs: build-firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out completed repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/enroll-wifi-stability-0.3.7
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install all test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_test.txt

      - name: Compile Home Assistant integration
        run: python -m compileall -q custom_components/ha_ios_ancs

      - name: Run complete repository test suite
        run: python -m pytest -q tools/tests tests
