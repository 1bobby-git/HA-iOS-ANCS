name: Fix iOS ANCS 0.6.9 documentation contract once

"on":
  push:
    branches:
      - "release/v0.6.9-firmware-0.3.8"
    paths:
      - ".github/workflows/fix-v0.6.9-documentation-contract-once.yml"

permissions:
  contents: write

concurrency:
  group: fix-ios-ancs-v0.6.9-documentation-contract
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: "release/v0.6.9-firmware-0.3.8"
          fetch-depth: 0

      - name: Correct documentation contract and remove this workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tools/tests/test_documentation_contract.py")
          text = test_path.read_text(encoding="utf-8")
          old = 'assert manifest["version"] == "0.6.8"'
          new = 'assert manifest["version"] == "0.6.9"'
          if text.count(old) != 1:
              raise RuntimeError(f"Expected one old documentation contract, found {text.count(old)}")
          test_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow_path = Path(".github/workflows/fix-v0.6.9-documentation-contract-once.yml")
          if not workflow_path.is_file():
              raise RuntimeError("Temporary workflow is missing")
          workflow_path.unlink()
          PY

      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align documentation contract with integration 0.6.9"
          git push origin HEAD:"release/v0.6.9-firmware-0.3.8"
