name: Rebuild iOS ANCS horizontal logo once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebuild-ancs-horizontal-logo-once.yml

permissions:
  contents: write

jobs:
  rebuild-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate horizontal PNG logos from the existing icon
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          from PIL import Image, ImageDraw, ImageFont

          brand_dir = Path("custom_components/ha_ios_ancs/brand")
          icon_path = brand_dir / "icon@2x.png"
          logo_path = brand_dir / "logo.png"
          logo_2x_path = brand_dir / "logo@2x.png"

          source = Image.open(icon_path).convert("RGBA")
          background = source.getpixel((0, 0))
          foreground = (5, 10, 5, 255)

          width, height = 1280, 256
          canvas = Image.new("RGBA", (width, height), background)

          # 기존 icon@2x.png 전체를 비율 왜곡 없이 왼쪽 256×256 영역에 그대로 사용합니다.
          icon = source.resize((height, height), Image.Resampling.LANCZOS)
          canvas.alpha_composite(icon, (0, 0))

          draw = ImageDraw.Draw(canvas)
          draw.rounded_rectangle((292, 44, 298, 212), radius=3, fill=foreground)

          font_path = Path("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf")
          if not font_path.is_file():
              raise RuntimeError(f"Required font not found: {font_path}")

          small_font = ImageFont.truetype(str(font_path), 30)
          large_font = ImageFont.truetype(str(font_path), 92)
          draw.text((338, 42), "HOME ASSISTANT", font=small_font, fill=foreground)
          draw.text((338, 88), "iOS ANCS", font=large_font, fill=foreground)

          canvas.save(logo_2x_path, format="PNG", optimize=True)
          canvas.resize((640, 128), Image.Resampling.LANCZOS).save(
              logo_path,
              format="PNG",
              optimize=True,
          )

          with Image.open(logo_2x_path) as generated_2x:
              assert generated_2x.size == (1280, 256)
          with Image.open(logo_path) as generated:
              assert generated.size == (640, 128)

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          branding_pattern = re.compile(
              r"<!-- project-branding:start -->.*?<!-- project-branding:end -->",
              re.DOTALL,
          )
          match = branding_pattern.search(readme)
          if not match:
              raise RuntimeError("README project-branding block not found")

          branding = match.group(0)
          replacement = (
              '<img src="custom_components/ha_ios_ancs/brand/logo@2x.png" '
              'alt="iOS ANCS 로고" width="520">'
          )
          updated_branding, count = re.subn(
              r'<img src="[^"]+" alt="iOS ANCS[^"]*" width="[^"]+">',
              replacement,
              branding,
              count=1,
          )
          if count != 1:
              raise RuntimeError("README iOS ANCS logo element not found")

          readme_path.write_text(
              readme[: match.start()] + updated_branding + readme[match.end() :],
              encoding="utf-8",
          )

          obsolete_svg = Path("media/readme-logo.svg")
          if obsolete_svg.exists():
              obsolete_svg.unlink()
          PY

      - name: Commit generated logos
        run: |
          set -euo pipefail
          rm -f .github/workflows/rebuild-ancs-horizontal-logo-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md custom_components/ha_ios_ancs/brand/logo.png custom_components/ha_ios_ancs/brand/logo@2x.png media/readme-logo.svg .github/workflows/rebuild-ancs-horizontal-logo-once.yml 2>/dev/null || true
          git add -A
          git diff --cached --stat
          git commit -m "fix: rebuild iOS ANCS horizontal brand logo"
          git push
