name: Resilience workbench

"on":
  push:
    branches: [fix/connection-resilience-20261012]
    paths: [.github/workflows/resilience-workbench.yml]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply release patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess, tempfile
          root = pathlib.Path('.resilience-upload-20261012')
          text = ''.join((root / f'p2.part{i}').read_text().strip() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(text, validate=True))
          expected = '0eba7a99371f36972a121bbfafd2ba590d0bc5d7c77de7e4498cdf8eb2b59201'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch digest mismatch'
          with tempfile.NamedTemporaryFile(suffix='.patch') as f:
              f.write(patch)
              f.flush()
              subprocess.run(['git', 'apply', '--check', f.name], check=True)
              subprocess.run(['git', 'apply', f.name], check=True)
          PY
          git rm -r .resilience-upload-20261012
          git add components main custom_components tools tests docs README.md README.en.md CHANGELOG.md CMakeLists.txt
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: validate resilience diagnostics and prepare companion 0.6.13 firmware 0.3.9'
          git push origin HEAD:refs/heads/fix/connection-resilience-20261012
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  tests:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --disable-pip-version-check -r requirements_test.txt
      - run: python -m compileall -q custom_components/ha_ios_ancs
      - name: Regression tests before binary finalization
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests tools/tests --ignore=tools/tests/test_release_integrity.py --ignore=tools/tests/test_multi_target_contract.py 2>&1 | tee resilience-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resilience-test-results-v039
          path: resilience-tests.log
          retention-days: 3
  firmware:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c2, esp32c3, esp32c5, esp32c6, esp32c61, esp32s3]
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - name: Build using project script
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/build.sh 2>&1 | tee "resilience-${TARGET}-build.log"
      - name: Package and fingerprint images
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          source "$IDF_PATH/export.sh"
          python tools/package_firmware.py --target "$TARGET" --build-dir "build-${TARGET}" --output "artifacts/${TARGET}"
      - uses: actions/upload-artifact@v4
        with:
          name: resilience-release-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resilience-build-log-${{ matrix.target }}
          path: resilience-${{ matrix.target }}-build.log
          retention-days: 3
  finalize:
    needs: [apply, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          pattern: resilience-release-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify exact source and embedded image fingerprints
        env:
          SOURCE_COMMIT: ${{ needs.apply.outputs.sha }}
        run: python tools/finalize_firmware_release.py --artifacts artifacts/release --source-commit "$SOURCE_COMMIT"
      - name: Commit verified installer images to isolated branch
        run: |
          set -euo pipefail
          git add docs README.md README.en.md
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: publish verified firmware 0.3.9 installer images and provenance'
          git push origin HEAD:refs/heads/fix/connection-resilience-20261012
      - run: python -m pip install --disable-pip-version-check -r requirements_test.txt
      - name: Complete source and Home Assistant validation
        run: |
          set -o pipefail
          python -m compileall -q custom_components/ha_ios_ancs
          python -m pytest -q tools/tests tests 2>&1 | tee resilience-final-tests.log
      - name: Stage companion package and release checksums
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          out = pathlib.Path('artifacts/release')
          root = pathlib.Path('custom_components/ha_ios_ancs')
          with zipfile.ZipFile(out / 'ha_ios_ancs.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for file in sorted(root.rglob('*')):
                  if file.is_file() and '__pycache__' not in file.parts and file.suffix != '.pyc':
                      z.write(file, file.relative_to(root))
          files = sorted(p for p in out.iterdir() if p.is_file())
          (out / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: resilience-verified-release-v0613
          path: artifacts/release
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resilience-final-validation
          path: resilience-final-tests.log
          retention-days: 3
