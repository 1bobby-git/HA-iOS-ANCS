name: Prepare firmware 0.3.5 onboarding

on:
  push:
    branches:
      - fix/firmware-0.3.5-onboarding

permissions:
  contents: write

concurrency:
  group: prepare-ios-ancs-firmware-0.3.5
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: espressif/idf:v6.0.2

    steps:
      - name: Check out firmware branch
        uses: actions/checkout@v4
        with:
          ref: fix/firmware-0.3.5-onboarding
          fetch-depth: 0
          persist-credentials: true

      - name: Apply onboarding and recovery improvements
        shell: bash
        run: |
          set -euo pipefail
          cat tools/firmware_patch_parts/*.part > /tmp/prepare-firmware.py
          python /tmp/prepare-firmware.py
          python -m py_compile /tmp/prepare-firmware.py

      - name: Build seven factory images
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" >/dev/null
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          version = "0.3.5"
          targets = (
              ("ESP32", "esp32"),
              ("ESP32-C2", "esp32c2"),
              ("ESP32-C3", "esp32c3"),
              ("ESP32-C5", "esp32c5"),
              ("ESP32-C6", "esp32c6"),
              ("ESP32-C61", "esp32c61"),
              ("ESP32-S3", "esp32s3"),
          )
          root = Path.cwd()
          lock_path = root / "dependencies.lock"
          original_lock = lock_path.read_bytes() if lock_path.exists() else None
          release_root = Path("/tmp/ios-ancs-release")
          shutil.rmtree(release_root, ignore_errors=True)
          release_root.mkdir(parents=True)
          digests: dict[str, str] = {}

          try:
              for _family, target in targets:
                  build_dir = root / f"build-{target}"
                  sdkconfig = root / f"sdkconfig.{target}"
                  shutil.rmtree(build_dir, ignore_errors=True)
                  sdkconfig.unlink(missing_ok=True)
                  subprocess.run(
                      [
                          "idf.py",
                          f"-B{build_dir}",
                          f"-DIDF_TARGET={target}",
                          f"-DSDKCONFIG={sdkconfig}",
                          "build",
                      ],
                      cwd=root,
                      check=True,
                  )

                  flasher = json.loads(
                      (build_dir / "flasher_args.json").read_text(encoding="utf-8")
                  )
                  chip = str(flasher["extra_esptool_args"]["chip"])
                  settings = flasher["flash_settings"]
                  output = release_root / f"ios-ancs-{target}-v{version}.factory.bin"
                  command = [
                      sys.executable,
                      "-m",
                      "esptool",
                      "--chip",
                      chip,
                      "merge-bin",
                      "-o",
                      str(output),
                      "--flash-mode",
                      str(settings["flash_mode"]),
                      "--flash-size",
                      "4MB",
                      "--flash-freq",
                      str(settings["flash_freq"]),
                  ]
                  for offset, filename in flasher["flash_files"].items():
                      command.extend([str(offset), str(build_dir / filename)])
                  subprocess.run(command, cwd=root, check=True)
                  digests[target] = hashlib.sha256(output.read_bytes()).hexdigest()
          finally:
              if original_lock is None:
                  lock_path.unlink(missing_ok=True)
              else:
                  lock_path.write_bytes(original_lock)

          firmware_root = root / "docs" / "firmware"
          shutil.rmtree(firmware_root, ignore_errors=True)
          for _family, target in targets:
              destination = firmware_root / target
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copy2(
                  release_root / f"ios-ancs-{target}-v{version}.factory.bin",
                  destination / f"ios-ancs-{target}-v{version}.factory.bin",
              )

          app_js_path = root / "docs" / "app.js"
          app_js = app_js_path.read_text(encoding="utf-8")
          for _family, target in targets:
              pattern = rf'({target}: \{{.*?hash: "SHA256 )[A-F0-9]{{12}}(")'
              app_js, count = re.subn(
                  pattern,
                  rf"\g<1>{digests[target][:12].upper()}\g<2>",
                  app_js,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"unable to update installer hash for {target}")
          app_js_path.write_text(app_js, encoding="utf-8")

          index_path = root / "docs" / "index.html"
          index = index_path.read_text(encoding="utf-8")
          index, count = re.subn(
              r'(<span id="build-hash">SHA256 )[A-F0-9]{12}(</span>)',
              rf"\g<1>{digests['esp32'][:12].upper()}\g<2>",
              index,
              count=1,
          )
          if count != 1:
              raise SystemExit("unable to update default installer hash")
          index_path.write_text(index, encoding="utf-8")

          release_test_path = root / "tools" / "tests" / "test_release_integrity.py"
          release_test = release_test_path.read_text(encoding="utf-8")
          release_test, count = re.subn(
              r'(<span id=\\"build-hash\\">SHA256 )[A-F0-9]{12}(</span>)',
              rf"\g<1>{digests['esp32'][:12].upper()}\g<2>",
              release_test,
              count=1,
          )
          if count != 1:
              raise SystemExit("unable to update default hash assertion")
          release_test_path.write_text(release_test, encoding="utf-8")

          for fingerprint in (root / "docs").glob("release-fingerprints-v*.sha256"):
              fingerprint.unlink()
          fingerprint_path = root / f"docs/release-fingerprints-v{version}.sha256"
          fingerprint_path.write_text(
              "\n".join(
                  f"{digests[target]}  docs/firmware/{target}/ios-ancs-{target}-v{version}.factory.bin"
                  for _family, target in targets
              )
              + "\n",
              encoding="utf-8",
          )

          manifests = (
              root / "docs" / "manifests" / "ios-ancs.json",
              root / "docs" / "manifests" / "esp32-c6.json",
          )
          for manifest_path in manifests:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest.get("version") != version:
                  raise SystemExit(f"unexpected installer version in {manifest_path}")
              for build in manifest.get("builds", []):
                  for part in build.get("parts", []):
                      if f"v{version}.factory.bin" not in part["path"]:
                          raise SystemExit(
                              f"stale firmware path in {manifest_path}: {part['path']}"
                          )
          PY

      - name: Run firmware and repository contract tests
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nodejs
          python -m pip install --disable-pip-version-check pytest pyyaml
          python -m pytest -q tools/tests
          git diff --check

      - name: Commit generated source and firmware
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .github/workflows/prepare-firmware-0.3.5-onboarding.yml \
            tools/firmware_patch_parts \
            build-esp32 build-esp32c2 build-esp32c3 build-esp32c5 \
            build-esp32c6 build-esp32c61 build-esp32s3 \
            sdkconfig.esp32 sdkconfig.esp32c2 sdkconfig.esp32c3 \
            sdkconfig.esp32c5 sdkconfig.esp32c6 sdkconfig.esp32c61 \
            sdkconfig.esp32s3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release firmware 0.3.5 onboarding and recovery fixes"
          git push origin HEAD:fix/firmware-0.3.5-onboarding

  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out generated firmware commit
        uses: actions/checkout@v4
        with:
          ref: fix/firmware-0.3.5-onboarding
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Home Assistant test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_test.txt

      - name: Compile integration
        run: python -m compileall -q custom_components/ha_ios_ancs

      - name: Run complete source and Home Assistant tests
        run: python -m pytest -q tools/tests tests

      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master
