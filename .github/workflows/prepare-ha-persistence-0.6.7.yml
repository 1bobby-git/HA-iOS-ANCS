name: Prepare iOS ANCS Home Assistant persistence

on:
  push:
    branches:
      - improve/ha-persistence-0.6.7

permissions:
  contents: write

concurrency:
  group: prepare-ios-ancs-ha-persistence
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out persistence branch
        uses: actions/checkout@v4
        with:
          ref: improve/ha-persistence-0.6.7
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Apply delayed persistence and regression coverage
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          replace(
              "custom_components/ha_ios_ancs/__init__.py",
              "_STORAGE_VERSION = 1\n",
              "_STORAGE_VERSION = 1\n_STORAGE_SAVE_DELAY_SECONDS = 2.0\n",
          )
          replace(
              "custom_components/ha_ios_ancs/__init__.py",
              "        hass.async_create_task(store.async_save(dict(notification)))",
              "        snapshot = dict(notification)\n"
              "        store.async_delay_save(\n"
              "            lambda: snapshot,\n"
              "            _STORAGE_SAVE_DELAY_SECONDS,\n"
              "        )",
          )
          replace(
              "custom_components/ha_ios_ancs/manifest.json",
              '"version": "0.6.6"',
              '"version": "0.6.7"',
          )

          test_path = Path("tests/test_init.py")
          test_source = test_path.read_text(encoding="utf-8")
          test_source = test_source.replace(
              "from unittest.mock import AsyncMock, patch",
              "from unittest.mock import AsyncMock, MagicMock, patch",
              1,
          )
          replacement = '''def test_setup_entry_persists_new_complete_notification(
              registry_hass: HomeAssistant, run
          ) -> None:
              """Coalesce accepted notifications so details survive restart efficiently."""

              hass = registry_hass
              registered = run(
                  async_register_mqtt_ancs_source(
                      hass,
                      "ios_ancs_A1B2C3",
                      device_name="Kitchen Relay",
                  )
              )
              hass.states.async_set(registered.entity.entity_id, "unknown")
              entry = make_source_entry()
              with patch.object(
                  hass.config_entries,
                  "async_setup",
                  new=AsyncMock(return_value=True),
              ):
                  run(hass.config_entries.async_add(entry))
              hass.config_entries.async_forward_entry_setups = AsyncMock()
              delay_save = MagicMock()

              with (
                  patch.object(Store, "async_load", new=AsyncMock(return_value=None)),
                  patch.object(Store, "async_delay_save", new=delay_save),
              ):
                  assert run(async_setup_entry(hass, entry)) is True
                  payload = stored_notification(relay_id="new-relay", title="New title")
                  hass.states.async_set(
                      registered.entity.entity_id,
                      payload["relay_id"],
                      payload,
                  )
                  run(hass.async_block_till_done())

              notification_calls = [
                  item for item in delay_save.call_args_list
                  if len(item.args) >= 2 and item.args[1] == 2.0
              ]
              assert len(notification_calls) == 1
              data_func, delay = notification_calls[0].args
              assert delay == 2.0
              assert data_func() == payload
              run(entry.runtime_data.async_stop())


          def test_setup_entry_persists_current_source_snapshot_on_start('''.replace("          ", "")
          test_source, substitutions = re.subn(
              r"def test_setup_entry_persists_new_complete_notification\(.*?\n\ndef test_setup_entry_persists_current_source_snapshot_on_start\(",
              replacement,
              test_source,
              count=1,
              flags=re.S,
          )
          if substitutions != 1:
              raise SystemExit("unable to replace persistence regression test")
          test_path.write_text(test_source, encoding="utf-8")

          documentation_path = Path("tools/tests/test_documentation_contract.py")
          documentation_source = documentation_path.read_text(encoding="utf-8")
          documentation_source = documentation_source.replace(
              'assert manifest["version"] == "0.6.6"',
              'assert manifest["version"] == "0.6.7"',
              1,
          )
          documentation_source = documentation_source.replace(
              "assert len(jobs) == 2",
              "assert len(jobs) == 3",
              1,
          )
          documentation_path.write_text(documentation_source, encoding="utf-8")

          contract_source = (
              "from pathlib import Path\n\n"
              "ROOT = Path(__file__).resolve().parents[2]\n"
              "SOURCE = ROOT / \"custom_components\" / \"ha_ios_ancs\" / \"__init__.py\"\n\n\n"
              "def test_notification_persistence_is_coalesced_and_private():\n"
              "    source = SOURCE.read_text(encoding=\"utf-8\")\n"
              "    assert \"private=True\" in source\n"
              "    assert \"_STORAGE_SAVE_DELAY_SECONDS = 2.0\" in source\n"
              "    assert \"store.async_delay_save(\" in source\n"
              "    assert \"lambda: snapshot\" in source\n"
              "    assert \"hass.async_create_task(store.async_save(dict(notification)))\" not in source\n"
          )
          Path("tools/tests/test_ha_persistence_contract.py").write_text(
              contract_source,
              encoding="utf-8",
          )
      - name: Run source and Home Assistant tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements_test.txt
          python -m compileall -q custom_components/ha_ios_ancs
          python -m pytest -q tools/tests tests
      - name: Commit tested persistence changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ha_ios_ancs/__init__.py custom_components/ha_ios_ancs/manifest.json tests/test_init.py tools/tests/test_documentation_contract.py tools/tests/test_ha_persistence_contract.py
          git commit -m "Release Home Assistant integration 0.6.7"
          git push origin HEAD:improve/ha-persistence-0.6.7
