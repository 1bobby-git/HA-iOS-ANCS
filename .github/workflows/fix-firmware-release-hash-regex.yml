name: Fix firmware release hash regex

on:
  push:
    branches:
      - fix/firmware-0.3.5-onboarding

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firmware-0.3.5-onboarding
          persist-credentials: true
      - name: Fix release integrity source regex
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/prepare-firmware-0.3.5-onboarding.yml")
          text = path.read_text(encoding="utf-8")
          old = r'''              r'(<span id=\\"build-hash\\">SHA256 )[A-F0-9]{12}(</span>)',
'''
          new = r'''              r'(<span id="build-hash">SHA256 )[A-F0-9]{12}(</span>)',
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected release hash regex")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit workflow correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/prepare-firmware-0.3.5-onboarding.yml
          git commit -m "Fix firmware release hash update"
          git push origin HEAD:fix/firmware-0.3.5-onboarding
