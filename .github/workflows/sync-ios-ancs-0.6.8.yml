name: Prepare clean iOS ANCS 0.6.8 release branch

on:
  push:
    branches:
      - release/ios-ancs-0.6.8
    paths:
      - .github/workflows/sync-ios-ancs-0.6.8.yml

permissions:
  contents: write

concurrency:
  group: prepare-clean-ios-ancs-0.6.8-release
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out clean release branch
        uses: actions/checkout@v4
        with:
          ref: release/ios-ancs-0.6.8
          fetch-depth: 1
          persist-credentials: true

      - name: Replace tree with validated release tree
        env:
          VALIDATED_SHA: b2ecf39c137bd03a2ed7d46a9d4b419dd0c4428a
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$VALIDATED_SHA"
          git read-tree --reset -u FETCH_HEAD

          test ! -f .github/workflows/sync-ios-ancs-0.6.8.yml
          grep -F 'set(PROJECT_VER "0.3.6")' CMakeLists.txt
          grep -F '"version": "0.6.8"' custom_components/ha_ios_ancs/manifest.json
          grep -F '"version": "0.3.6"' docs/manifests/ios-ancs.json
          test -f docs/release-fingerprints-v0.3.6.sha256
          for target in esp32 esp32c2 esp32c3 esp32c5 esp32c6 esp32c61 esp32s3; do
            test -f "docs/firmware/${target}/ios-ancs-${target}-v0.3.6.factory.bin"
          done
          sha256sum -c docs/release-fingerprints-v0.3.6.sha256
          git diff --cached --check

      - name: Commit validated release tree on current main lineage
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release iOS ANCS integration 0.6.8 and firmware 0.3.6"
          git push origin HEAD:release/ios-ancs-0.6.8
