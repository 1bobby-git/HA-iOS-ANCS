name: One-time horizontal README logo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-horizontal-logo-once.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create horizontal logo and update README
        env:
          REPOSITORY_NAME: HA-iOS-ANCS
          LOGO_SOURCE: media/readme-logo.svg
          LOGO_WIDTH: "480"
          LOGO_ALT: iOS ANCS 가로형 로고
          MAKE_SVG: "1"
          ICON_LOCAL: custom_components/ha_ios_ancs/brand/icon@2x.png
          ICON_URL: https://raw.githubusercontent.com/1bobby-git/brands/master/custom_integrations/ha_ios_ancs/icon%402x.png
          LOGO_LINE_1: Home Assistant
          LOGO_LINE_2: iOS ANCS
          LOGO_ACCENT: "#0ea5e9"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import html
          import os
          import re
          import urllib.request
          from pathlib import Path

          repo = os.environ["REPOSITORY_NAME"]
          logo_source = os.environ["LOGO_SOURCE"]
          logo_width = os.environ["LOGO_WIDTH"]
          logo_alt = os.environ["LOGO_ALT"]

          if os.environ.get("MAKE_SVG") == "1":
              icon_path = Path(os.environ.get("ICON_LOCAL", ""))
              if icon_path.is_file():
                  icon_bytes = icon_path.read_bytes()
              else:
                  with urllib.request.urlopen(os.environ["ICON_URL"], timeout=30) as response:
                      icon_bytes = response.read()
              encoded = base64.b64encode(icon_bytes).decode("ascii")
              accent = os.environ["LOGO_ACCENT"]
              line1 = html.escape(os.environ.get("LOGO_LINE_1", ""))
              line2 = html.escape(os.environ.get("LOGO_LINE_2", ""))
              if line2:
                  wordmark = (
                      f'<text x="245" y="83" fill="{accent}" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" letter-spacing="0.5">{line1}</text>'
                      f'<text x="245" y="145" fill="{accent}" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">{line2}</text>'
                  )
              else:
                  wordmark = f'<text x="245" y="122" fill="{accent}" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">{line1}</text>'
              svg = (
                  '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">'
                  '<rect width="900" height="200" rx="34" fill="#ffffff"/>'
                  f'<rect x="1" y="1" width="898" height="198" rx="33" fill="none" stroke="{accent}" stroke-opacity="0.16" stroke-width="2"/>'
                  f'<image x="20" y="20" width="160" height="160" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,{encoded}"/>'
                  f'<rect x="205" y="42" width="3" height="116" rx="1.5" fill="{accent}" opacity="0.55"/>'
                  f'{wordmark}</svg>'
              )
              output = Path(logo_source)
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(svg, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          block = f'''<!-- project-branding:start -->
<p align="center">
  <img src="{logo_source}" alt="{html.escape(logo_alt, quote=True)}" width="{logo_width}">
</p>
<p align="center">
  <a href="https://github.com/1bobby-git/{repo}/stargazers">
    <img src="https://img.shields.io/github/stars/1bobby-git/{repo}?style=flat-square&logo=github&label=Stars" alt="GitHub Stars">
  </a>
</p>
<!-- project-branding:end -->

'''
          pattern = re.compile(r'<!-- project-branding:start -->.*?<!-- project-branding:end -->\s*', re.S)
          text = pattern.sub(block, text, count=1) if pattern.search(text) else block + text.lstrip("\ufeff")
          readme.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/readme-horizontal-logo-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: use horizontal logo in README"
            git push
          fi
