name: Build and finalize firmware 0.3.8

"on":
  push:
    branches:
      - release/fixed-pin-0.3.8
    paths:
      - .github/workflows/release-0.3.8.yml

permissions:
  contents: write

concurrency:
  group: release-fixed-pin-0.3.8
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release/fixed-pin-0.3.8

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Apply source changes and build all firmware targets
