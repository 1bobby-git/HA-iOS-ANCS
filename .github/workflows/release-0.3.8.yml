          python /tmp/release_038.py

      - name: Commit prepared firmware release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: publish fixed-PIN firmware 0.3.8"
          git push origin "HEAD:${RELEASE_BRANCH}"

  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out built release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_test.txt

      - name: Compile Home Assistant integration
        run: python -m compileall -q custom_components/ha_ios_ancs

      - name: Run complete repository test suite
        run: python -m pytest -q tools/tests tests

      - name: Remove temporary workflow and leave a clean branch
        shell: bash
        run: |
          rm -f .github/workflows/release-0.3.8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove temporary release workflow"
          git push origin "HEAD:${RELEASE_BRANCH}"
          test -z "$(git status --porcelain)"
