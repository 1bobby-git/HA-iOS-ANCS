name: Stage firmware 0.4.1 release (temporary)

# One-off: copies the verified Firmware run artifacts into the installer
# layout and prepares a draft release. Removed again before the merge.
"on":
  push:
    branches: [fix/ble-reconnect]
    paths:
      - ".github/workflows/stage-release-0.4.1.yml"

permissions: {}

env:
  SOURCE_COMMIT: 5366a90a75c3afa08d1761eb67627e91fa9b8f16
  BUILD_RUN: "43165482384"

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ble-reconnect
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          pattern: firmware-esp32*
          path: ${{ runner.temp }}/artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify artifacts and stage installer images
        run: |
          set -euo pipefail
          python tools/finalize_firmware_release.py --artifacts "$RUNNER_TEMP/artifacts" --source-commit "$SOURCE_COMMIT"
          python -m pip install --disable-pip-version-check pytest
          git add -A docs README.md README.en.md
          python -m pytest -q tools/tests/test_multi_target_contract.py tools/tests/test_release_integrity.py
      - name: Commit staged images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish verified firmware 0.4.1 installer images and provenance" \
            -m "Artifacts of Firmware run ${BUILD_RUN}, built from ${SOURCE_COMMIT}."
          git push origin HEAD:fix/ble-reconnect
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release
          find "$RUNNER_TEMP/artifacts" -type f -name 'ios-ancs-*-v0.4.1.*' -exec cp {} release/ \;
          (cd custom_components/ha_ios_ancs && zip -qr "$GITHUB_WORKSPACE/release/ha_ios_ancs.zip" . -x '*/__pycache__/*')
          cat > release/release-provenance.json <<JSON
          {
            "integration_version": "0.6.16",
            "firmware_version": "0.4.1",
            "source_commit": "${SOURCE_COMMIT}",
            "build_run": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN}",
            "staging_run": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "hardware_validated": false
          }
          JSON
          (cd release && sha256sum -- * > SHA256SUMS)
          test "$(ls release | wc -l)" -eq 24
          gh release create v0.6.16 --draft --target fix/ble-reconnect \
            --title "iOS ANCS 0.6.16 / Firmware 0.4.1" \
            --notes-file docs/releases/v0.6.16.md release/*
