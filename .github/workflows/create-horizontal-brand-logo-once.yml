name: Create iOS ANCS horizontal brand logo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-horizontal-brand-logo-once.yml

permissions:
  contents: write

jobs:
  create-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate horizontal PNG brand assets
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          import re
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont

          brand_dir = Path("custom_components/ha_ios_ancs/brand")
          source_path = brand_dir / "icon@2x.png"
          if not source_path.is_file():
              raise SystemExit(f"Missing source icon: {source_path}")

          canvas_width = 1280
          canvas_height = 256
          canvas = Image.new("RGBA", (canvas_width, canvas_height), (255, 255, 255, 0))

          icon = Image.open(source_path).convert("RGBA")
          bbox = icon.getbbox()
          if bbox:
              icon = icon.crop(bbox)
          icon.thumbnail((208, 208), Image.Resampling.LANCZOS)
          icon_x = 24 + (208 - icon.width) // 2
          icon_y = 24 + (208 - icon.height) // 2
          canvas.alpha_composite(icon, (icon_x, icon_y))

          draw = ImageDraw.Draw(canvas)
          primary = (3, 169, 244, 255)
          secondary = (2, 136, 209, 255)
          draw.rounded_rectangle((254, 46, 260, 210), radius=3, fill=(3, 169, 244, 190))

          regular_font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold_font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          small_font = ImageFont.truetype(regular_font_path, 42)
          large_font = ImageFont.truetype(bold_font_path, 88)

          draw.text((300, 42), "Home Assistant", font=small_font, fill=primary)
          draw.text((296, 98), "iOS ANCS", font=large_font, fill=secondary)

          logo_2x = brand_dir / "logo@2x.png"
          logo_1x = brand_dir / "logo.png"
          canvas.save(logo_2x, format="PNG", optimize=True)
          canvas.resize((640, 128), Image.Resampling.LANCZOS).save(
              logo_1x, format="PNG", optimize=True
          )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?s)(<!-- project-branding:start -->\s*<p align="center">\s*)'
              r'<img src="[^"]+" alt="[^"]+" width="\d+">'
          )
          replacement = (
              r'\1<img src="custom_components/ha_ios_ancs/brand/logo@2x.png" '
              r'alt="iOS ANCS 로고" width="520">'
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("README branding image was not found exactly once")
          readme.write_text(updated, encoding="utf-8")
          PY

          rm -f media/readme-logo.svg
          rm -f .github/workflows/create-horizontal-brand-logo-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: add iOS ANCS horizontal brand logo"
            git push
          fi
