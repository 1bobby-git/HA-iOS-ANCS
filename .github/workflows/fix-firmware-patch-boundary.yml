name: Fix firmware patch boundary

on:
  push:
    branches:
      - fix/firmware-0.3.5-onboarding

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firmware-0.3.5-onboarding
          persist-credentials: true
      - name: Repair split string boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/firmware_patch_parts/03.part")
          text = path.read_text(encoding="utf-8")
          needle = (
              '    "static esp_err_t send_json(httpd_req_t *req, const char *json)\\n"\n'
              '    "{\\n",\n'
          )
          replacement = (
              '    "static esp_err_t send_json(httpd_req_t *req, const char *json)\\n"\n'
              '    "{\\n"\n'
          )
          if text.count(needle) != 1:
              raise SystemExit("unexpected firmware patch boundary")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
      - name: Commit repaired patch part
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/firmware_patch_parts/03.part
          git commit -m "Fix firmware preparation script boundary"
          git push origin HEAD:fix/firmware-0.3.5-onboarding
