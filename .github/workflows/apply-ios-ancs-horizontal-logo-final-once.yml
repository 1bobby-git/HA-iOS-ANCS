name: Apply final iOS ANCS horizontal logo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ios-ancs-horizontal-logo-final-once.yml

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate horizontal logos from the existing icons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageDraw, ImageFont

          BRAND = Path("custom_components/ha_ios_ancs/brand")
          FONT_REGULAR = Path("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf")
          FONT_BOLD = Path("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf")

          if not FONT_REGULAR.is_file() or not FONT_BOLD.is_file():
              raise SystemExit("DejaVu Sans fonts are not available on the runner")

          def create_logo(icon_name: str, output_name: str, scale: int) -> None:
              icon_size = 256 * scale
              canvas_size = (800 * scale, 256 * scale)
              text_x = 300 * scale

              icon_path = BRAND / icon_name
              output_path = BRAND / output_name
              icon = Image.open(icon_path).convert("RGB")
              if icon.size != (icon_size, icon_size):
                  raise SystemExit(f"Unexpected source icon size: {icon_path} = {icon.size}")

              canvas = Image.new("RGB", canvas_size, "white")
              canvas.paste(icon, (0, 0))
              draw = ImageDraw.Draw(canvas)

              regular = ImageFont.truetype(str(FONT_REGULAR), 39 * scale)
              bold = ImageFont.truetype(str(FONT_BOLD), 76 * scale)

              draw.text(
                  (text_x, 42 * scale),
                  "Home Assistant",
                  font=regular,
                  fill="#374151",
                  stroke_width=0,
              )
              draw.text(
                  (text_x, 104 * scale),
                  "iOS ANCS",
                  font=bold,
                  fill="#0b0f16",
                  stroke_width=0,
              )

              canvas.save(output_path, format="PNG", optimize=True)

              rendered = Image.open(output_path).convert("RGB")
              rendered_icon = rendered.crop((0, 0, icon_size, icon_size))
              if ImageChops.difference(icon, rendered_icon).getbbox() is not None:
                  raise SystemExit(f"The original icon pixels changed in {output_path}")

          create_logo("icon.png", "logo.png", 1)
          create_logo("icon@2x.png", "logo@2x.png", 2)

          readme = Path("README.md").read_text(encoding="utf-8")
          expected_reference = "custom_components/ha_ios_ancs/brand/logo@2x.png"
          if expected_reference not in readme:
              raise SystemExit(f"README does not reference {expected_reference}")
          PY

      - name: Commit generated logo assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-ios-ancs-horizontal-logo-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ha_ios_ancs/brand/logo.png
          git add custom_components/ha_ios_ancs/brand/logo@2x.png
          git add .github/workflows/apply-ios-ancs-horizontal-logo-final-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: use original iOS ANCS icon in horizontal logos"
          git push
