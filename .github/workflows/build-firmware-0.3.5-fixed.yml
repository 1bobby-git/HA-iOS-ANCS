name: Build firmware 0.3.5 fixed

on:
  push:
    branches:
      - fix/firmware-0.3.5-onboarding

permissions:
  contents: write

concurrency:
  group: prepare-ios-ancs-firmware-0.3.5
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: espressif/idf:v6.0.2

    steps:
      - name: Check out firmware branch
        uses: actions/checkout@v4
        with:
          ref: fix/firmware-0.3.5-onboarding
          fetch-depth: 0
          persist-credentials: true

      - name: Apply onboarding and recovery improvements
        shell: bash
        run: |
          set -euo pipefail
          cat tools/firmware_patch_parts/*.part > /tmp/prepare-firmware.py
          python /tmp/prepare-firmware.py
          python -m py_compile /tmp/prepare-firmware.py

      - name: Build seven factory images and installer metadata
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" >/dev/null
          python tools/build_firmware_release.py

      - name: Run firmware and repository contract tests
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nodejs
          python -m pip install --disable-pip-version-check pytest pyyaml
          python -m pytest -q tools/tests
          git diff --check

      - name: Commit generated source and firmware
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            tools/firmware_patch_parts \
            tools/build_firmware_release.py \
            build-esp32 build-esp32c2 build-esp32c3 build-esp32c5 \
            build-esp32c6 build-esp32c61 build-esp32s3 \
            sdkconfig.esp32 sdkconfig.esp32c2 sdkconfig.esp32c3 \
            sdkconfig.esp32c5 sdkconfig.esp32c6 sdkconfig.esp32c61 \
            sdkconfig.esp32s3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release firmware 0.3.5 onboarding and recovery fixes"
          git push origin HEAD:fix/firmware-0.3.5-onboarding

  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out generated firmware commit
        uses: actions/checkout@v4
        with:
          ref: fix/firmware-0.3.5-onboarding
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Home Assistant test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_test.txt

      - name: Compile integration
        run: python -m compileall -q custom_components/ha_ios_ancs

      - name: Run complete source and Home Assistant tests
        run: python -m pytest -q tools/tests tests

      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master
