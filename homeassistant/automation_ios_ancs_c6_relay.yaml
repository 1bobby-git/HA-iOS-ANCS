alias: Relay iOS ANCS notifications to your mobile app
id: ios_ancs_relay_to_mobile_app
description: Forward newly received, complete iOS ANCS notifications without availability restores.
trigger:
  - platform: state
    entity_id: sensor.replace_with_your_last_notification_entity
condition:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != trigger.to_state.state }}
  - condition: template
    value_template: >-
      {{ trigger.from_state.state != 'unavailable' }}
  - condition: template
    value_template: >-
      {{ trigger.to_state.state not in ['unknown', 'unavailable'] }}
  - condition: template
    value_template: >-
      {{ trigger.to_state.attributes.get('complete', false) | bool(false) }}
  - condition: template
    value_template: >-
      {{ not (trigger.to_state.attributes.get('pre_existing', true) | bool(true)) }}
action:
  - service: notify.replace_with_your_mobile_app_service
    data:
      title: "[iOS ANCS] {{ trigger.to_state.attributes.get('title') or trigger.to_state.attributes.get('app_id') }}"
      message: >-
        {{ trigger.to_state.attributes.get('message')
           or trigger.to_state.attributes.get('subtitle')
           or trigger.to_state.attributes.get('app_id')
              ~ ' (' ~ (trigger.to_state.attributes.get('category') or 'unknown') ~ ')' }}
mode: queued
max: 10
